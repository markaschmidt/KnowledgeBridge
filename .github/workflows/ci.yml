name: Verify and release
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package:plugin
      - run: node scripts/verify-release.mjs
      - if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/verify-release.mjs ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: obsidian-plugin
          path: dist/obsidian-integrated/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: obsidian-plugin
          path: release
      - name: Publish this repository's artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --title "$RELEASE_TAG" --generate-notes
